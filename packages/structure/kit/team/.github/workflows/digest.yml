# Periodic digest: fetch → propose → draft PR (proposal file only).
# Requires module research + SOURCES.md. Raw dumps stay CI-local (gitignored).
# Remove or disable without research/feeds.
name: digest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Require digest + SOURCES
        run: |
          if [[ ! -f docs/research/digest/README.md ]]; then
            echo "Geen digest-scaffold (kit: --modules research) — skip."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! -f docs/research/digest/SOURCES.md ]]; then
            echo "No SOURCES.md — skipping (copy SOURCES.example.md)."
            echo "skip=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >>"$GITHUB_OUTPUT"
          echo "day=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - name: Fetch feeds
        if: steps.gate.outputs.skip != 'true'
        run: make digest-fetch
      - name: Propose (no auto-radar)
        if: steps.gate.outputs.skip != 'true'
        run: make digest-propose
      - name: Draft PR with the proposal
        if: steps.gate.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(digest): proposal ${{ steps.gate.outputs.day }}"
          title: "digest: proposal ${{ steps.gate.outputs.day }}"
          body: |
            Automatic digest proposal (P5): **no** auto-update of `radar.md`.

            1. Review `docs/research/digest/proposals/*-draft.md`
            2. Accept rows → by hand into `radar.md` / wantlist
            3. Merge = the proposal in git; curation stays human/agent

            Raw feeds are not in this PR (`data/external/digest/` is gitignored).
          branch: digest/propose-auto
          delete-branch: true
          draft: true
          add-paths: |
            docs/research/digest/proposals/
