# Git hooks that run before every commit. Install: make setup. Update: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: '\.md$'
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: no-private-data
        name: no raw, external or runtime data in git
        language: fail
        entry: these files do not belong in git (data/raw, external, interim, runtime, models)
        files: '^data/(raw|external|interim|runtime|models)/'
        exclude: '(README\.md|\.gitkeep)$'
      - id: no-sync-conflicts
        name: no sync-conflict files
        language: fail
        entry: remove the sync-conflict files
        files: '\.sync-conflict-'
