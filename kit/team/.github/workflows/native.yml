# Hard native FFI checks (NATIVE_STRICT). Soft stays in check.yml → make check.
# Remove or disable this workflow if the project has no apps/native or apps/native-c.
name: native

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install maturin (PyO3-pad)
        run: uv tool install maturin || pipx install maturin || true
      - run: make setup
      # check-full = soft check + deps-audit + native-bindings-strict (NATIVE_STRICT=1)
      - run: make check-full NATIVE_FFI=auto
