# Publiceert naar de publieke npm-registry (registry.npmjs.org).
#
# Triggered by:
#   - Tags: v*, structure-v*, lab-v*
#   - Manual: workflow_dispatch (kies meta, structure, lab, of all)
#
# Vereist één repository-secret: NPM_TOKEN (npm Access Token met
# "Read and write" voor de packages; 2FA-omzeiling aan als je 2FA hebt).
# GITHUB_TOKEN werkt hier niet: dat geldt alleen voor GitHub Packages.

name: publish

on:
  push:
    tags:
      - 'v*'
      - 'structure-v*'
      - 'lab-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - meta
          - structure
          - lab

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  # ── GitHub Release (alleen bij v* tags, niet v0.*) ──
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.'))
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cardine ${{ github.ref_name }}" \
            --generate-notes \
            --draft

  # ── Publish cardine (meta) ──
  publish-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'meta' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - name: Publish cardine
        run: npm publish

  # ── Publish @lennaertds/cardine-structure ──
  publish-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'structure-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'structure' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @lennaertds/cardine-structure
        working-directory: packages/structure
        run: npm publish

  # ── Publish @lennaertds/cardine-lab ──
  publish-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'lab-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'lab' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @lennaertds/cardine-lab
        working-directory: packages/lab
        run: npm publish
