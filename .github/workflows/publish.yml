# Publiceert naar de publieke npm-registry (registry.npmjs.org) via
# **trusted publishing** (OIDC). Geen NPM_TOKEN, geen langlevend publiceertoken:
# npm vertrouwt deze workflow op basis van repository + workflowbestand en
# controleert dat met een kortlevend OIDC-token.
#
# Eenmalige inrichting op npmjs.com, PER PACKAGE (pakketpagina → Settings →
# Trusted Publisher → GitHub Actions). Alle velden zijn hoofdlettergevoelig:
#   Organization/user: Lennaertds
#   Repository:        cardine
#   Workflow filename: publish.yml        (incl. .yml, zonder pad)
#   Environment name:  leeg laten
#   Allowed actions:   "npm publish" toestaan (anders mag de verbinding alleen
#                      `npm stage publish`, wat een menselijke 2FA-stap vraagt)
#
# Triggers:
#   - Tags: v*, structure-v*, lab-v*
#   - Manual: workflow_dispatch (kies meta, structure, lab, of all)
#
# Belangrijk:
#   - Vul de verbinding in VOOR de tag push; een nieuwe verbinding die niet
#     binnen 2 dagen een geslaagde publish ziet, verloopt.
#   - Een bestaande verbinding kan niet worden aangepast: verwijderen en
#     opnieuw maken.
#   - Hernoem dit bestand of de repo niet — de verbinding is eraan vastgeklonken.
#   - npm CLI >= 11.21 (staged) c.q. 12.2 (dist-tags); Node 24 levert dat.
#   - Provenance wordt bij OIDC automatisch gegenereerd (geen --provenance).

name: publish

on:
  push:
    tags:
      - 'v*'
      - 'structure-v*'
      - 'lab-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - meta
          - structure
          - lab

jobs:
  # ── GitHub Release (alleen bij v* tags, niet v0.*) ──
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.')
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cardine ${{ github.ref_name }}" \
            --generate-notes \
            --draft

  # ── Publish cardine (meta) ──
  publish-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — verplicht voor trusted publishing
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'meta' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish cardine
        run: npm publish --access public

  # ── Publish @lennaertds/cardine-structure ──
  publish-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'structure-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'structure' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @lennaertds/cardine-structure
        working-directory: packages/structure
        run: npm publish --access public

  # ── Publish @lennaertds/cardine-lab ──
  publish-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'lab-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'lab' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @lennaertds/cardine-lab
        working-directory: packages/lab
        run: npm publish --access public
