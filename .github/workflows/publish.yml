# Publishes to the public npm registry (registry.npmjs.org) via
# **trusted publishing** (OIDC). No NPM_TOKEN, no long-lived publish token:
# npm trusts this workflow based on repository + workflow file and
# verifies that with a short-lived OIDC token.
#
# One-time setup on npmjs.com, PER PACKAGE (package page → Settings →
# Trusted Publisher → GitHub Actions). All fields are case-sensitive:
#   Organization/user: Lennaertds
#   Repository:        cardine
#   Workflow filename: publish.yml        (incl. .yml, without a path)
#   Environment name:  leave empty
#   Allowed actions:   allow "npm publish" (otherwise the connection may only
#                      `npm stage publish`, which asks for a human 2FA step)
#
# Triggers:
#   - Tags: v*, structure-v*, lab-v*
#   - Manual: workflow_dispatch (choose meta, structure, lab, or all)
#
# Important:
#   - Set up the connection BEFORE the tag push; a new connection that does not
#     see a successful publish within 2 days expires.
#   - An existing connection cannot be edited: delete it and
#     create it again.
#   - Do not rename this file or the repo — the connection is tied to them.
#   - npm CLI >= 11.21 (staged) resp. 12.2 (dist-tags); Node 24 provides that.
#   - Provenance is generated automatically with OIDC (no --provenance).

name: publish

on:
  push:
    tags:
      - 'v*'
      - 'structure-v*'
      - 'lab-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - meta
          - structure
          - lab

jobs:
  # ── GitHub Release (only on v* tags, not v0.*) ──
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.')
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cardine ${{ github.ref_name }}" \
            --generate-notes \
            --draft

  # ── Publish cardine (meta) ──
  publish-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC — required for trusted publishing
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'meta' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Node 24 levert npm 11.x; de stage/dist-tag-API vereist >= 12.2.
      - name: Pin npm 12.2.3
        run: npm i -g npm@12.2.3
      - name: Publish cardine
        run: npm publish --access public

  # ── Publish @lennaertds/cardine-structure ──
  publish-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'structure-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'structure' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Node 24 levert npm 11.x; de stage/dist-tag-API vereist >= 12.2.
      - name: Pin npm 12.2.3
        run: npm i -g npm@12.2.3
      - name: Publish @lennaertds/cardine-structure
        working-directory: packages/structure
        run: npm publish --access public

  # ── Publish @lennaertds/cardine-lab ──
  publish-lab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'lab-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'lab' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      # Node 24 levert npm 11.x; de stage/dist-tag-API vereist >= 12.2.
      - name: Pin npm 12.2.3
        run: npm i -g npm@12.2.3
      - name: Publish @lennaertds/cardine-lab
        working-directory: packages/lab
        run: npm publish --access public
