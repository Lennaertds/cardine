# Publish packages to GitHub Packages + GitHub Releases
#
# Triggered by:
#   - Tags: v*, structure-v*, lab-v*
#   - Manual: workflow_dispatch (kies structure, lab, of all)
#
# GITHUB_TOKEN heeft automatisch write:packages en write:contents.

name: publish

on:
  push:
    tags:
      - 'v*'
      - 'structure-v*'
      - 'lab-v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - structure
          - lab

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # ── GitHub Release (alleen bij v* tags, niet v0.*) ──
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'v0.'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lennaertds'
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Cardine ${{ github.ref_name }}" \
            --generate-notes \
            --draft

  # ── Publish @lennaertds/cardine-structure ──
  publish-structure:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'structure-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'structure' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lennaertds'
      - name: Publish @lennaertds/cardine-structure
        working-directory: packages/structure
        run: npm publish

  # ── Publish @lennaertds/cardine-lab ──
  publish-lab:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref_name, 'lab-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.package == 'lab' || inputs.package == 'all'))
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lennaertds'
      - name: Publish @lennaertds/cardine-lab
        working-directory: packages/lab
        run: npm publish